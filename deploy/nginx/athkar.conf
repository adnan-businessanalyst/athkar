# Static site — https://athkar.ghurabi.com
# Certbot will add listen 443 and certificate paths after:
#   sudo certbot --nginx -d athkar.ghurabi.com -d api.athkar.ghurabi.com

server {
    listen 80;
    listen [::]:80;
    server_name athkar.ghurabi.com;
    server_tokens off;

    root /var/www/athkar;
    index index.html;

    location ^~ /privacy {
        try_files $uri $uri/ /privacy/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API proxy — https://api.athkar.ghurabi.com
# After Certbot, copy the ssl_* lines from the site 443 block
# (or let Certbot write them). The API must stay on localhost:8080.

server {
    listen 80;
    listen [::]:80;
    server_name api.athkar.ghurabi.com;
    server_tokens off;

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
    }

    location = /sync {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
